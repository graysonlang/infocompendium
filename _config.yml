# Jekyll configuration for the GitHub Pages site.
# Built by .github/workflows/pages.yml with the github-pages gem;
# the site mirrors the repo layout, with each README as its folder's index.
title: infocompendium
description: Imaging, cataloging, and findings for the Activision Infocom compilation CD-ROMs
# Served at the custom domain root, so no baseurl prefix.
url: "https://infocompendium.org"
baseurl: ""

# No theme: _layouts/default.html and assets/site.css carry the whole look
# (color tokens, dark/light switcher, corner GitHub link).

plugins:
  - jekyll-optional-front-matter   # pages without front matter still build
  - jekyll-default-layout          # ...and get the theme layout
  - jekyll-titles-from-headings    # ...and take their title from the first heading
  - jekyll-readme-index            # README.md serves as index.html per folder
  - jekyll-relative-links          # links to .md files become links to the built pages

# Repo files that are not catalog material.
exclude:
  - AGENTS.md
  - infocompendium.code-workspace
  - scripts/
